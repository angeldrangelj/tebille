<title>Mis Gastos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: libro de cuentas personal — resumen del mes arriba, formulario + desglose en dos columnas, movimientos abajo */
:root{
  --bg:#F3F6F5; --surface:#FFFFFF; --fg:#14201C; --muted:#5B6B65; --line:#DCE4E1;
  --accent:#1F6F5C; --accent-soft:#E2F0EB; --warn:#B7791F; --bad:#B4413A; --good:#2F7D4F;
  --display:"Familjen Grotesk",system-ui,sans-serif;
  --body:"Instrument Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --c1:#1F6F5C; --c2:#3B6FB6; --c3:#B7791F; --c4:#8A4FA8; --c5:#C2524A; --c6:#2E8A8A; --c7:#6B7D2A; --c8:#A65E8C; --c9:#6E7A76;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1614; --surface:#17211E; --fg:#E4ECE9; --muted:#93A39D; --line:#2A3833;
  --accent:#5FC0A3; --accent-soft:#1D3530; --warn:#E0A84A; --bad:#E07B73; --good:#6CC28E;
  --c1:#5FC0A3; --c2:#7AA6E6; --c3:#E0A84A; --c4:#C08ADB; --c5:#E07B73; --c6:#62C4C4; --c7:#A9BE5A; --c8:#D894C0; --c9:#9AA7A3;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1614; --surface:#17211E; --fg:#E4ECE9; --muted:#93A39D; --line:#2A3833;
  --accent:#5FC0A3; --accent-soft:#1D3530; --warn:#E0A84A; --bad:#E07B73; --good:#6CC28E;
  --c1:#5FC0A3; --c2:#7AA6E6; --c3:#E0A84A; --c4:#C08ADB; --c5:#E07B73; --c6:#62C4C4; --c7:#A9BE5A; --c8:#D894C0; --c9:#9AA7A3;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:24px}
h1,h2{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:1.9rem;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.05rem;font-weight:600}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.month{display:flex;align-items:center;gap:6px}
.month span{min-width:9.5em;text-align:center;font-family:var(--display);font-weight:600;font-size:1.05rem;text-transform:capitalize}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:36px;height:36px;display:grid;place-items:center}
.iconbtn:hover{border-color:var(--accent)}

.summary{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.summary>div{background:var(--surface);padding:18px 20px;display:grid;gap:6px;align-content:start;min-width:0}
.big{font-family:var(--mono);font-size:2rem;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.mid{font-family:var(--mono);font-size:1.25rem;font-variant-numeric:tabular-nums}
.meter{height:8px;border-radius:4px;background:var(--accent-soft);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .3s}
.meter.warn i{background:var(--warn)} .meter.bad i{background:var(--bad)}
.sub{color:var(--muted);font-size:.85rem}
.pill{display:inline-block;font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.pill.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.pill.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}

.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:24px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:grid;gap:16px;align-content:start;min-width:0}
form{display:grid;gap:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:grid;gap:4px;min-width:0}
.field label{font-size:.8rem;color:var(--muted);font-weight:500}
input,select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 11px;min-width:0}
input:focus,select:focus{border-color:var(--accent);outline:none}
#f-monto{font-family:var(--mono);font-size:1.3rem}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cat{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:5px 11px;font-size:.85rem;display:flex;align-items:center;gap:6px}
.cat .dot{width:8px;height:8px;border-radius:50%}
.cat[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.primary{background:var(--accent);color:var(--surface);border:0;border-radius:8px;padding:10px 18px;font-weight:600}
.primary:hover{filter:brightness(1.08)}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:9px 14px}

.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:7.5em minmax(0,1fr) auto;align-items:center;gap:10px;font-size:.9rem;background:none;border:0;padding:0;text-align:left;width:100%}
.bar .track{height:12px;background:var(--accent-soft);border-radius:3px;overflow:hidden}
.bar .track i{display:block;height:100%;border-radius:3px}
.bar .amt{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.85rem;text-align:right}
.bar.dim{opacity:.4}
.trend{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end;height:120px}
.trend div{display:grid;gap:4px;align-content:end;height:100%;text-align:center}
.trend b{display:block;background:var(--line);border-radius:4px 4px 0 0;min-height:2px}
.trend .cur b{background:var(--accent)}
.trend small{font-size:.72rem;color:var(--muted);text-transform:capitalize}

.list{display:grid}
.item{display:grid;grid-template-columns:3.2em minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.day{font-family:var(--mono);font-size:.8rem;color:var(--muted);line-height:1.2}
.day strong{display:block;font-size:1.1rem;color:var(--fg);font-weight:500}
.desc{min-width:0}
.desc .t{font-weight:500;overflow-wrap:anywhere}
.desc .m{font-size:.8rem;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.item .amt{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:500}
.tiny{display:flex;gap:2px}
.tiny button{background:none;border:0;color:var(--muted);padding:4px 6px;border-radius:6px;font-size:.8rem}
.tiny button:hover{color:var(--fg);background:var(--accent-soft)}
.tiny button.confirm{color:var(--bad);font-weight:600}
.ex{font-size:.68rem;font-weight:600;color:var(--warn);border:1px solid currentColor;border-radius:4px;padding:0 5px}
.empty{color:var(--muted);padding:24px 0;text-align:center;display:grid;gap:6px}
.listhead{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
.listhead select{width:auto}
.banner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;border:1px dashed var(--warn);border-radius:10px;padding:10px 14px;font-size:.88rem}
.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;align-items:end}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.9rem;max-width:calc(100% - 32px)}
.status{font-size:.78rem;color:var(--muted)}

@media (max-width:820px){.cols{grid-template-columns:1fr}.summary{grid-template-columns:1fr 1fr}.summary>div:first-child{grid-column:1/-1}}
@media (max-width:440px){.row2{grid-template-columns:1fr}.big{font-size:1.7rem}.bar{grid-template-columns:6em minmax(0,1fr) auto}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Mis Gastos</h1>
      <div class="status" id="status">Conectando…</div>
    </div>
    <div class="month">
      <button class="iconbtn" id="prev" aria-label="Mes anterior">‹</button>
      <span id="monthLabel"></span>
      <button class="iconbtn" id="next" aria-label="Mes siguiente">›</button>
    </div>
  </header>

  <div class="banner" id="exBanner" hidden>
    <span>Hay movimientos de <strong>ejemplo</strong> para que veas cómo funciona. Bórralos cuando empieces con los tuyos.</span>
    <button class="ghost" id="clearEx">Borrar ejemplos</button>
  </div>

  <section class="summary" aria-label="Resumen del mes">
    <div>
      <span class="label">Gastado este mes</span>
      <span class="big" id="sTotal">—</span>
      <div class="meter" id="sMeter"><i style="width:0"></i></div>
      <span class="sub" id="sBudget"></span>
    </div>
    <div>
      <span class="label">Promedio por día</span>
      <span class="mid" id="sAvg">—</span>
      <span class="sub" id="sAvgSub"></span>
    </div>
    <div>
      <span class="label">Mayor categoría</span>
      <span class="mid" id="sTop">—</span>
      <span class="sub" id="sTopSub"></span>
    </div>
  </section>

  <div class="cols">
    <section class="panel" aria-labelledby="formTitle">
      <h2 id="formTitle">Registrar gasto</h2>
      <form id="form" autocomplete="off">
        <div class="field">
          <label for="f-monto">Monto</label>
          <input id="f-monto" inputmode="decimal" placeholder="0" required>
        </div>
        <div class="field">
          <label for="f-desc">Descripción</label>
          <input id="f-desc" placeholder="Ej. mercado de la semana" maxlength="80">
        </div>
        <div class="field">
          <span class="label" style="text-transform:none;letter-spacing:0;font-size:.8rem;font-weight:500">Categoría</span>
          <div class="cats" id="catPicker" role="group" aria-label="Categoría"></div>
        </div>
        <div class="row2">
          <div class="field">
            <label for="f-fecha">Fecha</label>
            <input id="f-fecha" type="date" required>
          </div>
          <div class="field">
            <label for="f-metodo">Pagado con</label>
            <select id="f-metodo">
              <option>Efectivo</option><option>Débito</option><option>Crédito</option><option>Transferencia</option>
            </select>
          </div>
        </div>
        <div class="actions">
          <button class="primary" type="submit" id="saveBtn">Agregar gasto</button>
          <button class="ghost" type="button" id="cancelEdit" hidden>Cancelar</button>
        </div>
      </form>
    </section>

    <section class="panel" aria-labelledby="catTitle">
      <div class="listhead"><h2 id="catTitle">En qué se va el dinero</h2><span class="sub">Toca una categoría para filtrar</span></div>
      <div class="bars" id="bars"></div>
      <div>
        <div class="label" style="margin-bottom:8px">Últimos 6 meses</div>
        <div class="trend" id="trend"></div>
      </div>
    </section>
  </div>

  <section class="panel" aria-labelledby="listTitle">
    <div class="listhead">
      <h2 id="listTitle">Movimientos</h2>
      <select id="filter" aria-label="Filtrar por categoría"></select>
    </div>
    <div class="list" id="list"></div>
  </section>

  <section class="panel" aria-labelledby="setTitle">
    <h2 id="setTitle">Ajustes</h2>
    <div class="settings">
      <div class="field">
        <label for="s-moneda">Moneda</label>
        <select id="s-moneda">
          <option value="USD">Dólar (USD)</option><option value="COP">Peso colombiano (COP)</option>
          <option value="MXN">Peso mexicano (MXN)</option><option value="ARS">Peso argentino (ARS)</option>
          <option value="CLP">Peso chileno (CLP)</option><option value="PEN">Sol peruano (PEN)</option>
          <option value="EUR">Euro (EUR)</option><option value="GTQ">Quetzal (GTQ)</option>
          <option value="DOP">Peso dominicano (DOP)</option><option value="BOB">Boliviano (BOB)</option>
          <option value="UYU">Peso uruguayo (UYU)</option><option value="VES">Bolívar (VES)</option>
        </select>
      </div>
      <div class="field">
        <label for="s-pres">Presupuesto mensual</label>
        <input id="s-pres" inputmode="decimal" placeholder="Sin presupuesto">
      </div>
      <div><button class="ghost" id="saveSettings" type="button">Guardar ajustes</button></div>
    </div>
  </section>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const CATS=[
  {id:"comida",n:"Comida",c:"--c1"},{id:"transporte",n:"Transporte",c:"--c2"},{id:"vivienda",n:"Vivienda",c:"--c3"},
  {id:"servicios",n:"Servicios",c:"--c4"},{id:"salud",n:"Salud",c:"--c5"},{id:"ocio",n:"Ocio",c:"--c6"},
  {id:"compras",n:"Compras",c:"--c7"},{id:"educacion",n:"Educación",c:"--c8"},{id:"otros",n:"Otros",c:"--c9"}];
const catOf=id=>CATS.find(c=>c.id===id)||CATS[CATS.length-1];
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const today=new Date();
const todayStr=`${today.getFullYear()}-${pad(today.getMonth()+1)}-${pad(today.getDate())}`;

let gastos=[], ajustes={moneda:"USD",presupuesto:0};
let ym={y:today.getFullYear(),m:today.getMonth()};
let filtro="", editId=null, catSel="comida", store=null, confirmId=null;

function fmt(v){
  try{return new Intl.NumberFormat("es",{style:"currency",currency:ajustes.moneda||"USD",maximumFractionDigits:["COP","CLP","ARS"].includes(ajustes.moneda)?0:2}).format(v)}
  catch{return v.toFixed(2)}
}
function parseMonto(s){
  s=String(s).trim().replace(/[^\d.,-]/g,"");
  if(!s) return NaN;
  const lc=s.lastIndexOf(","), ld=s.lastIndexOf(".");
  if(lc>-1&&ld>-1){ s = lc>ld ? s.replace(/\./g,"").replace(",",".") : s.replace(/,/g,""); }
  else if(lc>-1){ s = /^\d{1,3}(,\d{3})+$/.test(s) ? s.replace(/,/g,"") : s.replace(",","."); }
  else if(ld>-1 && /^\d{1,3}(\.\d{3})+$/.test(s)){ s=s.replace(/\./g,""); }
  return parseFloat(s);
}
const monthKey=(y,m)=>`${y}-${pad(m+1)}`;
const monthName=(y,m,opt={month:"long",year:"numeric"})=>new Date(y,m,1).toLocaleDateString("es",opt);
function toast(msg){const t=$("toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2600)}

/* ---------- almacenamiento: db del artefacto, o navegador como respaldo ---------- */
const local={
  read(){try{return JSON.parse(localStorage.getItem("misgastos")||"null")||{gastos:[],ajustes}}catch{return{gastos:[],ajustes}}},
  write(){try{localStorage.setItem("misgastos",JSON.stringify({gastos,ajustes}))}catch{}}
};
async function initStore(){
  let db=null;
  try{ db = window.claude?.use ? await window.claude.use("db") : null }catch{db=null}
  if(!db){
    const d=local.read(); gastos=d.gastos||[]; ajustes={...ajustes,...(d.ajustes||{})};
    $("status").textContent="Guardado solo en este navegador"; render(); return;
  }
  store=db;
  $("status").textContent="Sincronizado en la nube";
  db.collection("gastos").onSnapshot(s=>{gastos=s.docs.map(d=>({id:d.id,...d.data()}));render()},
    ()=>{$("status").textContent="Sin conexión con tus datos"});
  db.doc("config/ajustes").onSnapshot(s=>{if(s.exists){ajustes={...ajustes,...s.data()};render()}},()=>{});
}
async function saveGasto(obj,id){
  if(!store){ if(id){gastos=gastos.map(g=>g.id===id?{...obj,id}:g)} else gastos.push({...obj,id:"g"+Date.now()}); local.write(); render(); return true; }
  try{ if(id) await store.collection("gastos").doc(id).set(obj); else await store.collection("gastos").add(obj); return true }
  catch(e){ toast(e?.code==="invalid_argument"?"Solo la dueña o el dueño de esta app puede guardar gastos.":"No se pudo guardar. Inténtalo de nuevo."); return false }
}
async function removeGasto(id){
  if(!store){gastos=gastos.filter(g=>g.id!==id);local.write();render();return}
  try{await store.collection("gastos").doc(id).delete()}catch{toast("No se pudo borrar.")}
}
async function saveAjustes(){
  if(!store){local.write();render();return}
  try{await store.doc("config/ajustes").set(ajustes)}catch{toast("No se pudieron guardar los ajustes.")}
}

/* ---------- render ---------- */
function inMonth(g,y,m){return (g.fecha||"").startsWith(monthKey(y,m))}
function render(){
  const {y,m}=ym;
  $("monthLabel").textContent=monthName(y,m);
  const mes=gastos.filter(g=>inMonth(g,y,m));
  const total=mes.reduce((a,g)=>a+(+g.monto||0),0);

  $("exBanner").hidden=!gastos.some(g=>g.ejemplo);

  // resumen
  $("sTotal").textContent=fmt(total);
  const pres=+ajustes.presupuesto||0, meter=$("sMeter");
  meter.className="meter";
  if(pres>0){
    const p=total/pres;
    meter.firstElementChild.style.width=Math.min(100,p*100)+"%";
    if(p>=1) meter.classList.add("bad"); else if(p>=.8) meter.classList.add("warn");
    const cls=p>=1?"bad":p>=.8?"warn":"";
    const txt=p>=1?`Te pasaste por ${fmt(total-pres)}`:`Quedan ${fmt(pres-total)}`;
    $("sBudget").innerHTML=`<span class="pill ${cls}">${Math.round(p*100)}%</span> de ${fmt(pres)} · ${txt}`;
  } else { meter.firstElementChild.style.width="0"; $("sBudget").textContent="Define un presupuesto en Ajustes para ver cuánto te queda."; }

  const isCur=y===today.getFullYear()&&m===today.getMonth();
  const dias=isCur?today.getDate():new Date(y,m+1,0).getDate();
  $("sAvg").textContent=fmt(total/dias);
  $("sAvgSub").textContent=`${mes.length} movimiento${mes.length===1?"":"s"} en ${dias} día${dias===1?"":"s"}`;

  const porCat=CATS.map(c=>({...c,t:mes.filter(g=>catOf(g.categoria).id===c.id).reduce((a,g)=>a+(+g.monto||0),0)})).filter(c=>c.t>0).sort((a,b)=>b.t-a.t);
  if(porCat.length){$("sTop").textContent=porCat[0].n;$("sTopSub").textContent=`${fmt(porCat[0].t)} · ${Math.round(porCat[0].t/total*100)}% del mes`}
  else{$("sTop").textContent="—";$("sTopSub").textContent="Sin gastos este mes"}

  // barras
  const max=porCat[0]?.t||1;
  $("bars").innerHTML=porCat.length?porCat.map(c=>`<button class="bar ${filtro&&filtro!==c.id?"dim":""}" data-cat="${c.id}" aria-pressed="${filtro===c.id}">
    <span>${c.n}</span><span class="track"><i style="width:${c.t/max*100}%;background:var(${c.c})"></i></span><span class="amt">${fmt(c.t)}</span></button>`).join("")
    :`<div class="empty">Cuando registres gastos de ${monthName(y,m,{month:"long"})}, aquí verás cuánto va a cada categoría.</div>`;

  // tendencia
  const meses=[...Array(6)].map((_,i)=>{const d=new Date(y,m-5+i,1);return{y:d.getFullYear(),m:d.getMonth()}});
  const tots=meses.map(k=>gastos.filter(g=>inMonth(g,k.y,k.m)).reduce((a,g)=>a+(+g.monto||0),0));
  const tmax=Math.max(...tots,1);
  $("trend").innerHTML=meses.map((k,i)=>`<div class="${i===5?"cur":""}" title="${monthName(k.y,k.m)}: ${fmt(tots[i])}">
    <b style="height:${tots[i]/tmax*90}px"></b><small>${monthName(k.y,k.m,{month:"short"}).replace(".","")}</small></div>`).join("");

  // filtro
  const fsel=$("filter");
  fsel.innerHTML=`<option value="">Todas las categorías</option>`+CATS.map(c=>`<option value="${c.id}">${c.n}</option>`).join("");
  fsel.value=filtro;

  // lista
  const rows=mes.filter(g=>!filtro||catOf(g.categoria).id===filtro).sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||"")||(b.creado||0)-(a.creado||0));
  $("list").innerHTML=rows.length?rows.map(g=>{
    const c=catOf(g.categoria), d=new Date(g.fecha+"T12:00");
    return `<div class="item">
      <div class="day"><strong>${pad(d.getDate())}</strong>${d.toLocaleDateString("es",{weekday:"short"}).replace(".","")}</div>
      <div class="desc"><div class="t"></div>
        <div class="m"><span class="cat" style="padding:0;border:0;background:none"><span class="dot" style="background:var(${c.c})"></span>${c.n}</span><span>${g.metodo||""}</span>${g.ejemplo?'<span class="ex">Ejemplo</span>':""}</div></div>
      <div class="amt">${fmt(+g.monto||0)}</div>
      <div class="tiny"><button data-edit="${g.id}">Editar</button><button data-del="${g.id}" class="${confirmId===g.id?"confirm":""}">${confirmId===g.id?"¿Borrar?":"Borrar"}</button></div>
    </div>`}).join("")
    :`<div class="empty"><strong>${filtro?"Nada en esta categoría":"Aún no hay gastos en "+monthName(y,m,{month:"long"})}</strong><span>Usa el formulario de arriba para registrar el primero.</span></div>`;
  // descripciones como texto (evita inyectar HTML)
  [...$("list").querySelectorAll(".item .t")].forEach((el,i)=>el.textContent=rows[i].descripcion||catOf(rows[i].categoria).n);

  if(document.activeElement!==$("s-moneda")) $("s-moneda").value=ajustes.moneda||"USD";
  if(document.activeElement!==$("s-pres")) $("s-pres").value=ajustes.presupuesto||"";
}

function renderCats(){
  $("catPicker").innerHTML=CATS.map(c=>`<button type="button" class="cat" data-pick="${c.id}" aria-pressed="${catSel===c.id}"><span class="dot" style="background:var(${c.c})"></span>${c.n}</button>`).join("");
}
function resetForm(){
  editId=null; $("form").reset(); $("f-fecha").value=todayStr; catSel="comida"; renderCats();
  $("saveBtn").textContent="Agregar gasto"; $("formTitle").textContent="Registrar gasto"; $("cancelEdit").hidden=true;
}

/* ---------- eventos ---------- */
$("prev").onclick=()=>{ym=ym.m===0?{y:ym.y-1,m:11}:{y:ym.y,m:ym.m-1};confirmId=null;render()};
$("next").onclick=()=>{ym=ym.m===11?{y:ym.y+1,m:0}:{y:ym.y,m:ym.m+1};confirmId=null;render()};
$("catPicker").onclick=e=>{const b=e.target.closest("[data-pick]");if(b){catSel=b.dataset.pick;renderCats()}};
$("bars").onclick=e=>{const b=e.target.closest("[data-cat]");if(b){filtro=filtro===b.dataset.cat?"":b.dataset.cat;render()}};
$("filter").onchange=e=>{filtro=e.target.value;render()};
$("cancelEdit").onclick=resetForm;
$("form").onsubmit=async e=>{
  e.preventDefault();
  const monto=parseMonto($("f-monto").value);
  if(!(monto>0)){toast("Escribe un monto mayor que cero.");$("f-monto").focus();return}
  const fecha=$("f-fecha").value||todayStr;
  const prev=editId?gastos.find(g=>g.id===editId):null;
  const obj={monto:Math.round(monto*100)/100,descripcion:$("f-desc").value.trim(),categoria:catSel,fecha,metodo:$("f-metodo").value,creado:prev?.creado||Date.now()};
  const ok=await saveGasto(obj,editId);
  if(ok){
    toast(editId?"Gasto actualizado":"Gasto agregado");
    const [fy,fm]=fecha.split("-").map(Number); ym={y:fy,m:fm-1};
    resetForm(); render(); $("f-monto").focus();
  }
};
$("list").onclick=e=>{
  const ed=e.target.closest("[data-edit]"), dl=e.target.closest("[data-del]");
  if(ed){
    const g=gastos.find(x=>x.id===ed.dataset.edit); if(!g) return;
    editId=g.id; $("f-monto").value=g.monto; $("f-desc").value=g.descripcion||""; $("f-fecha").value=g.fecha; $("f-metodo").value=g.metodo||"Efectivo";
    catSel=catOf(g.categoria).id; renderCats();
    $("saveBtn").textContent="Guardar cambios"; $("formTitle").textContent="Editar gasto"; $("cancelEdit").hidden=false;
    $("form").scrollIntoView({behavior:"smooth",block:"start"}); $("f-monto").focus({preventScroll:true});
  }
  if(dl){
    const id=dl.dataset.del;
    if(confirmId===id){confirmId=null;removeGasto(id);toast("Gasto borrado")}
    else{confirmId=id;render();setTimeout(()=>{if(confirmId===id){confirmId=null;render()}},4000)}
  }
};
$("clearEx").onclick=async()=>{
  const ex=gastos.filter(g=>g.ejemplo);
  for(const g of ex) await removeGasto(g.id);
  toast("Ejemplos borrados");
};
$("saveSettings").onclick=async()=>{
  const p=parseMonto($("s-pres").value);
  ajustes={...ajustes,moneda:$("s-moneda").value,presupuesto:p>0?Math.round(p*100)/100:0};
  await saveAjustes(); render(); toast("Ajustes guardados");
};

resetForm(); render(); initStore();
</script>
